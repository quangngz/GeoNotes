<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeoNotes (Mongo) — teractive Map</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --bg:#f8f9fa; --card:#fff; --border:#e0e0e0; --muted:#666; --accent:#4285f4; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); }
    h1 { margin: 1rem auto .25rem; max-width: 1100px; padding: 0 1rem; }
    #status { max-width: 1100px; margin: 0 auto 1rem; padding: 0 1rem; color:#666; }
    form { margin: 1rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; background:#fff; }
    label { display:block; margin:.5rem 0 .25rem; }
    input, textarea { width: 100%; padding:.5rem; }
    button { margin-top: .5rem; padding:.5rem .75rem; cursor:pointer; }
    .row { display:flex; gap:1rem; }
    .half { flex:1; }
    .right { float:right; }
    /* App layout */
    #app { display:none; max-width: 1100px; margin: 0 auto 2rem; padding: 0 1rem; }
    #shell { height: 70vh; display:flex; gap: 16px; }
    #map { flex: 2; height: 100%; border-radius: 10px; background:#eaeaea; }
    #sidebar { flex:1; min-width: 300px; max-width: 420px; background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
    .pins-header { background: var(--accent); color:#fff; padding:12px 14px; font-weight:600; }
    #pins-list { overflow:auto; }
    .pin-item { padding: 12px 14px; border-bottom:1px solid #f0f0f0; cursor:pointer; }
    .pin-item:hover { background:#f7f7f7; }
    .pin-location { font-weight:600; font-size: 14px; }
    .pin-note { color:#444; font-size: 13px; margin-top: 4px; }
    .pin-date { color:#999; font-size:11px; margin-top:6px; }
    .no-pins { text-align:center; padding:40px 20px; color:#999; font-style:italic; }
    /* Modal */
    #pinModal { display:none; position: fixed; inset:0; background: rgba(0,0,0,.35); z-index: 10; align-items:center; justify-content:center; }
    #pinCard { background:#fff; border-radius:12px; padding:16px; width: min(520px, 92vw); border:1px solid #ddd; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
    #pinCard h3{ margin:0 0 .5rem 0; }
    .muted { color:#666; }
    .btn-danger { background:#dc3545; color:#fff; border:none; }
    .btn-primary { background:#4285f4; color:#fff; border:none; }
    .btn { padding:.5rem .75rem; border-radius:6px; border:1px solid #ccc; }
    .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  </style>
</head>
<body>
  <h1>GeoNotes</h1>
  <div id="status" class="muted"></div>

  <!-- Auth (unchanged) -->
  <div id="auth-forms">
    <form id="registerForm">
      <h3>Create account</h3>
      <label>Email</label>
      <input name="email" type="email" required />
      <label>Password</label>
      <input name="password" type="password" required />
      <button type="submit">Register</button>
    </form>

    <form id="loginForm">
      <h3>Login</h3>
      <label>Email</label>
      <input name="email" type="email" required />
      <label>Password</label>
      <input name="password" type="password" required />
      <button type="submit">Login</button>
    </form>
  </div>
  <h1>Testing H1</h1>

  <!-- App -->
  <div id="app">
    <div style="margin-bottom:10px;">
      <strong id="who"></strong>
      <button class="right" id="logoutBtn">Logout</button>
      <div class="muted">Tip: click anywhere on the map to drop a pin.</div>
    </div>

    <!-- Manual add form (kept) -->
    <form id="pinForm">
      <h3>Add a pin (manual)</h3>
      <div class="row">
        <div class="half">
          <label>Latitude</label>
          <input name="lat" id="latInput" type="number" step="0.000001" min="-90" max="90" required />
        </div>
        <div class="half">
          <label>Longitude</label>
          <input name="lng" id="lngInput" type="number" step="0.000001" min="-180" max="180" required />
        </div>
      </div>
      <label>Title</label>
      <input name="title" id="titleInput" maxlength="120" required />
      <label>Note</label>
      <textarea name="note" id="noteInput" rows="3" required></textarea>
      <button type="submit">Save Pin</button>
    </form>

    <!-- Map + Sidebar -->
    <div id="shell">
      <div id="map"></div>
      <div id="sidebar">
        <div class="pins-header">📍 Your Pins</div>
        <div id="pins-list">
          <div class="no-pins" id="noPins">No pins yet. Click on the map or use the form above.</div>
          <div id="pinsContainer"></div>
        </div>
      </div>
    </div>
  </div>
  <h2>Test pin modal</h2>

  <!-- Pin modal -->
  <div id="pinModal">
    <div id="pinCard">
      <h3 id="modalTitle">Add Pin</h3>
      <div class="row">
        <div class="half">
          <label>Latitude</label>
          <input id="mLat" type="number" step="0.000001" min="-90" max="90" required />
        </div>
        <div class="half">
          <label>Longitude</label>
          <input id="mLng" type="number" step="0.000001" min="-180" max="180" required />
        </div>
      </div>
      <label>Title</label>
      <input id="mTitle" maxlength="120" required />
      <label>Note</label>
      <textarea id="mNote" rows="3" required></textarea>
      <div class="actions">
        <button class="btn" id="cancelBtn" type="button">Cancel</button>
        <button class="btn btn-danger" id="deleteBtn" type="button" style="display:none;">Delete</button>
        <button class="btn btn-primary" id="saveBtn" type="button">Save</button>
      </div>
      <div class="muted" id="modalMsg" style="margin-top:6px;"></div>
    </div>
  </div>

<script>
/* ------------------ Auth (unchanged) ------------------ */
const STATUS = document.getElementById('status');
const AUTH = document.getElementById('auth-forms');
const APP = document.getElementById('app');
const WHO = document.getElementById('who');


window.addEventListener('error', e => {
  console.error('Global error:', e.error || e.message || e);
});
window.addEventListener('unhandledrejection', e => {
  console.error('Unhandled promise rejection:', e.reason);
});


async function getJSON(url, opts={}) {
  const r = await fetch(url, { headers: { "Content-Type":"application/json" }, credentials: "same-origin", ...opts });
  if (!r.ok) {
    let msg = r.statusText;
    try { const j = await r.json(); if (j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  return r.json();
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

document.getElementById('registerForm').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await getJSON("/api/register", { method:"POST", body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    await refresh();
  } catch (err) { alert(err.message); }
};
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await getJSON("/api/login", { method:"POST", body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    await refresh();
  } catch (err) { alert(err.message); }
};
document.getElementById('logoutBtn').onclick = async () => { await getJSON("/api/logout", { method:"POST" }); await refresh(); };

/* ------------------ Map + Pins ------------------ */
let map;
let markersById = new Map(); // id -> AdvancedMarkerElement
let currentEditing = null;
const pinsContainer = document.getElementById('pinsContainer');
const noPins = document.getElementById('noPins');

async function refresh() {
  try {
    const me = await fetch("/api/me", { credentials:"same-origin" }).then(r=>r.json());
    if (!me) {
      AUTH.style.display = '';
      APP.style.display = 'none';
      STATUS.textContent = "Not logged in.";
      return;
    }
    AUTH.style.display = 'none';
    APP.style.display = '';
    WHO.textContent = `Signed in as ${me.email}`;
    STATUS.textContent = "";
  } catch (e) {
    // Show auth forms instead of staying blank
    AUTH.style.display = '';
    APP.style.display = 'none';
    STATUS.textContent = "Auth check failed. Is the server running?";
    console.error(e);
    return;
  }

  // Only here if logged in:
  try {
    const pins = await getJSON("/api/pins");
    renderPinsList(pins);
    renderPinsOnMap(pins);
  } catch (e) {
    console.error(e);
    STATUS.textContent = "Failed to load pins.";
  }
}

/* initMap is called by Google Loader (script tag callback) */
async function initMap() {
  try {
    // Load libraries the modern way
    await google.maps.importLibrary("maps");
    await google.maps.importLibrary("marker");

    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: -37.8136, lng: 144.9631 }, zoom: 13, mapTypeControl:false, streetViewControl:false
    });

    map.addListener('click', (ev) => {
      openModal({ id:null, lat: ev.latLng.lat(), lng: ev.latLng.lng(), title:"", note:"" }, "Add Pin");
    });

    // After the map is ready, run the normal refresh (auth + pins)
    await refresh();
  } catch (e) {
    STATUS.textContent = "Failed to load Google Maps. Check API key & billing.";
    console.error(e);
  }
}
window.initMap = initMap;

/* ---- CRUD helpers ---- */
async function createPin(data) {
  const created = await getJSON("/api/pins", { method:"POST", body: JSON.stringify({
    lat: data.lat, lng: data.lng, title: data.title, note: data.note
  })});
  return created;
}
async function updatePin(id, data) {
  // NOTE: requires PUT /api/pins/:id on the server.
  const updated = await getJSON(`/api/pins/${id}`, { method:"PUT", body: JSON.stringify({
    title: data.title, note: data.note
  })});
  return updated;
}
async function deletePin(id) { await getJSON(`/api/pins/${id}`, { method:"DELETE" }); }

/* ---- Rendering ---- */
function renderPinsList(pins) {
  pinsContainer.innerHTML = "";
  if (!pins.length) { noPins.style.display = ""; return; }
  noPins.style.display = "none";
  for (const p of pins) {
    const item = document.createElement('div');
    item.className = 'pin-item';
    item.onclick = () => focusPin(p.id);
    item.innerHTML = `
      <div class="pin-location">📍 ${Number(p.lat).toFixed(4)}, ${Number(p.lng).toFixed(4)}</div>
      <div class="pin-note"><strong>${escapeHtml(p.title||'Untitled')}</strong>${p.title?'<br/>':''}${escapeHtml(p.note||'')}</div>
      <div class="pin-date">${new Date(p.created_at||p.createdAt||Date.now()).toLocaleString()}</div>
      <div style="margin-top:6px;">
        <button class="btn" onclick="event.stopPropagation(); openModal({id:'${p.id}',lat:${p.lat},lng:${p.lng},title:${JSON.stringify(p.title||'')},note:${JSON.stringify(p.note||'')}}, 'Edit Pin')">Edit</button>
        <button class="btn btn-danger" onclick="event.stopPropagation(); onDelete('${p.id}')">Delete</button>
      </div>
    `;
    pinsContainer.appendChild(item);
  }
}

function renderPinsOnMap(pins) {
  if (!map) return;
  // Remove markers not in list
  const ids = new Set(pins.map(p=>p.id));
  for (const [id, m] of markersById.entries()) {
    if (!ids.has(id)) { m.map = null; markersById.delete(id); }
  }
  // Add/update markers (AdvancedMarkerElement)
  const bounds = new google.maps.LatLngBounds();
  let hasBounds = false;
  for (const p of pins) {
    let marker = markersById.get(p.id);
    const pos = { lat: Number(p.lat), lng: Number(p.lng) };
    if (!marker) {
      marker = new google.maps.marker.AdvancedMarkerElement({
        map, position: pos, title: p.title || "Click to edit", gmpDraggable: false
      });
      marker.addListener('gmp-click', () => {
        openModal({ id: p.id, lat: p.lat, lng: p.lng, title: p.title||"", note: p.note||"" }, "Edit Pin");
      });
      markersById.set(p.id, marker);
    } else {
      marker.position = pos;
      marker.title = p.title || "Click to edit";
    }
    bounds.extend(pos); hasBounds = true;
  }
  if (hasBounds) { try { map.fitBounds(bounds); } catch {} }
}

function focusPin(id) {
  const m = markersById.get(id);
  if (!m || !m.position) return;
  map.setCenter(m.position); map.setZoom(16);
}

/* ---- Modal logic ---- */
const pinModal = document.getElementById('pinModal');
const modalTitle = document.getElementById('modalTitle');
const mLat = document.getElementById('mLat');
const mLng = document.getElementById('mLng');
const mTitle = document.getElementById('mTitle');
const mNote = document.getElementById('mNote');
const modalMsg = document.getElementById('modalMsg');
const deleteBtn = document.getElementById('deleteBtn');
document.getElementById('cancelBtn').onclick = () => closeModal();
document.getElementById('saveBtn').onclick = onSave;

function openModal(pin, heading) {
  currentEditing = { ...pin };
  modalTitle.textContent = heading || (pin.id ? "Edit Pin" : "Add Pin");
  mLat.value = pin.lat ?? "";
  mLng.value = pin.lng ?? "";
  mTitle.value = pin.title ?? "";
  mNote.value = pin.note ?? "";
  deleteBtn.style.display = pin.id ? "" : "none";
  deleteBtn.onclick = onDelete.bind(null, pin.id);
  modalMsg.textContent = "";
  pinModal.style.display = "flex";
}
function closeModal(){ pinModal.style.display = "none"; currentEditing = null; }

async function onSave() {
  const payload = {
    lat: parseFloat(mLat.value), lng: parseFloat(mLng.value),
    title: mTitle.value.trim(), note: mNote.value.trim()
  };
  if (!Number.isFinite(payload.lat) || !Number.isFinite(payload.lng) || !payload.title || !payload.note) {
    modalMsg.textContent = "Please fill all fields."; return;
  }
  try {
    if (currentEditing && currentEditing.id) {
      await updatePin(currentEditing.id, { title: payload.title, note: payload.note });
    } else {
      await createPin(payload);
    }
    closeModal(); await refresh();
  } catch (e) {
    modalMsg.textContent = e.message || "Failed to save.";
  }
}

async function onDelete(id) {
  if (!id) return;
  if (!confirm("Delete this pin?")) return;
  try { await deletePin(id); closeModal(); await refresh(); }
  catch(e){ alert(e.message || "Failed to delete"); }
}

/* Keep manual form working */
document.getElementById('pinForm').onsubmit = async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const payload = { lat: parseFloat(data.lat), lng: parseFloat(data.lng), title: data.title.trim(), note: data.note.trim() };
  try { await createPin(payload); e.target.reset(); await refresh(); }
  catch (err) { alert(err.message); }
};

/* Close modal by clicking backdrop */
pinModal.addEventListener('click', (e)=> { if (e.target === pinModal) closeModal(); });
</script>

<!-- IMPORTANT: Use async loader + callback. Replace YOUR_GOOGLE_MAPS_JS_API_KEY -->
<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBBUmA4z0sdQ_iRDGfClwXPZggthxMhhv0&v=weekly&loading=async&callback=initMap"
  async defer></script>
</body>
</html>
