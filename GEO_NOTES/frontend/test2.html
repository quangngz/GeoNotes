<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Interactive Map with Sidebar Notes</title>
  <style>
    body {
      margin: 0;
      font-family: "Comic Sans MS", "Comic Neue", cursive;
      display: flex;
      height: 100vh;
      background: #fef8e6;
    }

    #map {
      flex: 2;
      height: 100%;
    }

    #sidebar {
      flex: 1;
      padding: 20px;
      background: #f8f9fa;
      overflow-y: auto;
      border-left: 4px solid #333;
    }

    #sidebar h1 {
      text-align: center;
      color: #333;
      text-shadow: 2px 2px #f5d142;
      margin-top: 0;
    }

    .city {
      margin-bottom: 2rem;
    }

    .city h2 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      color: #333;
      text-shadow: 1px 1px #f5d142;
    }

    .note {
      background: #fffacd;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 15px;
      border: 3px solid #333;
      box-shadow: 3px 3px 0px #333;
      position: relative;
    }

    .note-delete {
      position: absolute;
      top: 5px;
      right: 8px;
      background: #ff4444;
      color: white;
      border: 2px solid #333;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 1px 1px 0 #333;
    }

    .note-delete:hover {
      background: #ff0000;
      transform: scale(1.1);
    }

    /* Cartoon popup */
    .cartoon-popup {
      position: absolute;
      background: #fffacd;
      border: 4px solid #333;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 5px 5px 0px #333;
      width: 250px;
      z-index: 1000;
      transform: translate(-50%, -100%);
      font-size: 14px;
      line-height: 1.4;
    }

    .cartoon-popup h3 {
      margin: 0 0 10px;
      text-shadow: 1px 1px #f5d142;
    }

    .cartoon-popup textarea {
      width: 100%;
      border: 3px solid #333;
      border-radius: 10px;
      font-family: inherit;
      padding: 8px;
      resize: none;
      background: #fff;
      box-sizing: border-box;
    }

    .cartoon-popup button {
      margin: 8px 5px 0 0;
      background: #ff69b4;
      color: white;
      font-weight: bold;
      border: 3px solid #333;
      border-radius: 15px;
      padding: 8px 15px;
      cursor: pointer;
      box-shadow: 2px 2px 0 #333;
      transition: transform 0.1s;
      font-family: inherit;
    }

    .cartoon-popup button:hover {
      transform: scale(1.05);
      background: #ff1493;
    }

    .cartoon-popup button.close-btn {
      background: #888;
    }

    .cartoon-popup button.close-btn:hover {
      background: #666;
    }

    .add-note-instruction {
      background: #e6f3ff;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 15px;
      border: 3px solid #333;
      box-shadow: 3px 3px 0px #333;
      text-align: center;
      color: #333;
    }
  </style>
</head>
<body>
  <!-- Map -->
  <div id="map"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <h1>Travel Notes 🗺️</h1>
    
    <div class="add-note-instruction">
      <strong>Click anywhere on the map to add a new note! ✨</strong>
    </div>

    <div id="notes-container">
      <div class="city">
        <h2>Melbourne</h2>
        <div class="note">
          Visited Federation Square, loved the atmosphere.
          <button class="note-delete" onclick="deleteNote(this)">×</button>
        </div>
        <div class="note">
          Best coffee near Flinders St station ☕.
          <button class="note-delete" onclick="deleteNote(this)">×</button>
        </div>
      </div>
      <div class="city">
        <h2>Sydney</h2>
        <div class="note">
          Opera House tour was amazing!
          <button class="note-delete" onclick="deleteNote(this)">×</button>
        </div>
        <div class="note">
          Bondi Beach walk in the morning.
          <button class="note-delete" onclick="deleteNote(this)">×</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Note creation popup -->
  <div id="popup" class="cartoon-popup" style="display:none;">
    <h3>New Note ✏️</h3>
    <textarea id="note-text" rows="4" placeholder="Write something amazing..."></textarea>
    <br />
    <input type="text" id="location-name" placeholder="Location name (optional)" style="width: 100%; margin: 8px 0; padding: 8px; border: 3px solid #333; border-radius: 10px; font-family: inherit; box-sizing: border-box;">
    <br />
    <button onclick="saveNote()">Save Note</button>
    <button class="close-btn" onclick="closePopup()">Close</button>
  </div>

  <script>
    let map;
    let activeMarker = null;
    let currentLatLng = null;
    let markers = [];

    function initMap() {
      const melbourne = { lat: -37.8136, lng: 144.9631 };
      map = new google.maps.Map(document.getElementById("map"), {
        center: melbourne,
        zoom: 6,
      });

      // Add existing markers for Melbourne and Sydney
      const melbourneMarker = new google.maps.Marker({ 
        position: melbourne, 
        map, 
        title: "Melbourne",
        icon: {
          url: 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ff69b4"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>'),
          scaledSize: new google.maps.Size(30, 30)
        }
      });

      const sydneyMarker = new google.maps.Marker({ 
        position: { lat: -33.8688, lng: 151.2093 }, 
        map, 
        title: "Sydney",
        icon: {
          url: 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ff69b4"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>'),
          scaledSize: new google.maps.Size(30, 30)
        }
      });

      markers.push(melbourneMarker, sydneyMarker);

      // On click, drop marker and open popup
      map.addListener("click", (event) => {
        addNoteMarker(event.latLng);
      });
    }

    function addNoteMarker(location) {
      if (activeMarker) activeMarker.setMap(null); // remove previous marker

      activeMarker = new google.maps.Marker({
        position: location,
        map: map,
        icon: {
          url: 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#4CAF50"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>'),
          scaledSize: new google.maps.Size(30, 30)
        }
      });

      currentLatLng = location;
      showPopup(location);
    }

    function showPopup(latLng) {
      const popup = document.getElementById("popup");
      popup.style.display = "block";

      // Position popup in the center of the screen for better UX
      popup.style.left = "50%";
      popup.style.top = "50%";
      popup.style.transform = "translate(-50%, -50%)";
    }

    function saveNote() {
      const noteText = document.getElementById("note-text").value.trim();
      const locationName = document.getElementById("location-name").value.trim() || "New Location";
      
      if (!noteText) {
        alert("Please write a note!");
        return;
      }

      // Make the temporary marker permanent
      if (activeMarker) {
        markers.push(activeMarker);
        activeMarker = null;
      }

      // Add note to sidebar
      addNoteToSidebar(locationName, noteText);
      
      closePopup();
    }

    function addNoteToSidebar(locationName, noteText) {
      const notesContainer = document.getElementById("notes-container");
      
      // Store the location coordinates
      if (currentLatLng) {
        locationNotes[locationName] = { 
          lat: currentLatLng.lat(), 
          lng: currentLatLng.lng() 
        };
      }
      
      // Check if city section already exists
      let citySection = Array.from(notesContainer.children).find(city => 
        city.querySelector('h2').textContent === locationName
      );

      if (!citySection) {
        // Create new city section
        citySection = document.createElement('div');
        citySection.className = 'city';
        citySection.innerHTML = `<h2>${locationName}</h2>`;
        notesContainer.appendChild(citySection);
      }

      // Add note to city section with coordinates for clicking
      const noteDiv = document.createElement('div');
      noteDiv.className = 'note';
      const coords = locationNotes[locationName];
      noteDiv.setAttribute('onclick', `focusOnLocation(${coords.lat}, ${coords.lng}, event)`);
      noteDiv.innerHTML = `${noteText}<button class="note-delete" onclick="deleteNote(this, event)">×</button>`;
      citySection.appendChild(noteDiv);

      // Scroll to the new note
      noteDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function focusOnLocation(lat, lng, event) {
      // Prevent triggering when clicking delete button
      if (event && event.target.classList.contains('note-delete')) {
        return;
      }
      
      // Center the map on the location and zoom in
      map.setCenter({ lat: lat, lng: lng });
      map.setZoom(14);
      
      // Add a temporary highlight effect
      const tempMarker = new google.maps.Marker({
        position: { lat: lat, lng: lng },
        map: map,
        icon: {
          url: 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#FFD700"><circle cx="12" cy="12" r="10" stroke="#333" stroke-width="2"/></svg>'),
          scaledSize: new google.maps.Size(40, 40)
        },
        animation: google.maps.Animation.BOUNCE
      });
      
      // Remove the highlight after 2 seconds
      setTimeout(() => {
        tempMarker.setMap(null);
      }, 2000);
    }

    function deleteNote(button, event) {
      // Stop event propagation to prevent focusing on location
      event.stopPropagation();
      
      if (confirm("Delete this note?")) {
        const note = button.parentElement;
        const citySection = note.parentElement;
        note.remove();
        
        // If no more notes in city section, remove the section
        if (citySection.children.length === 1) { // Only h2 left
          const cityName = citySection.querySelector('h2').textContent;
          delete locationNotes[cityName]; // Clean up coordinates
          citySection.remove();
        }
      }
    }

    function closePopup() {
      document.getElementById("popup").style.display = "none";
      document.getElementById("note-text").value = "";
      document.getElementById("location-name").value = "";
      
      // Remove temporary marker if popup is closed without saving
      if (activeMarker) {
        activeMarker.setMap(null);
        activeMarker = null;
      }
    }

    // Close popup with Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.getElementById("popup").style.display !== 'none') {
        closePopup();
      }
    });
  </script>

  <!-- Google Maps JS API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBBUmA4z0sdQ_iRDGfClwXPZggthxMhhv0&callback=initMap" async defer></script>
</body>
</html>
